services:
  - type: web
    name: tdpk-shopify-manager
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SHOPIFY_STORE
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_TOKEN
        sync: false
      - key: POSTEX_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PIN_HASH
        sync: false
      - key: TOTP_SECRET
        sync: false
      - key: MCP_API_KEY
        sync: false
      - key: MCP_ALLOWED_HOSTS
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_API_VERSION
        sync: false
      - key: META_PAGE_ID
        sync: false
      - key: META_AD_ACCOUNT_ID
        sync: false
      - key: META_IG_USER_ID
        sync: false
      - key: META_BUSINESS_ID
        sync: false

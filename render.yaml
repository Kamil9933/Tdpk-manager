services:
  - type: web
    name: tdpk-shopify-manager
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SHOPIFY_STORE
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_TOKEN
        sync: false
      - key: POSTEX_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PIN_HASH
        sync: false
      - key: TOTP_SECRET
        sync: false
      - key: MCP_API_KEY
        sync: false
      - key: MCP_ALLOWED_HOSTS
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_API_VERSION
        sync: false
      - key: META_PAGE_ID
        sync: false
      - key: META_AD_ACCOUNT_ID
        sync: false
      - key: META_IG_USER_ID
        sync: false
      - key: META_BUSINESS_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_MODEL
        sync: false
      # Phone notifications -- Telegram (free, no approval needed) and/or
      # email. Both are optional independently; notify_all() skips whichever
      # isn't configured. See core/notify.py's module docstring for setup
      # steps for each.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Shared secret Telegram sends back on every webhook call (set when
      # registering the webhook -- see core/notify.py's docstring) so the
      # /api/telegram/webhook route can verify a request actually came from
      # Telegram and not someone else hitting the URL.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: DIGEST_EMAIL_TO
        sync: false
      # Shared secret the GitHub Actions cron-tick workflow sends as
      # X-Cron-Secret -- must match the TDPK_CRON_SECRET repo secret.
      - key: CRON_SECRET
        sync: false
      # Optional: comma-separated HH:MM (24h, Pakistan local time) digest
      # send times. Defaults to "09:00,21:00" if unset.
      - key: DIGEST_TIMES
        sync: false
      # Bambu Cloud account (read-only use -- see core/bambu_cloud.py). This
      # account has 2FA on, so the login flow needs a one-time emailed code
      # via /api/printers/bambu/login-start then /login-verify; the resulting
      # token is cached in cost_settings, not re-derived from these every call.
      - key: BAMBU_CLOUD_EMAIL
        sync: false
      - key: BAMBU_CLOUD_PASSWORD
        sync: false

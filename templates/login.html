<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100f1a">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>TD Manager — Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0c0c11;
    --surface: #191921;
    --border: rgba(255,255,255,0.09);
    --accent: #8f7ff5;
    --accent-dim: rgba(143,127,245,0.15);
    --text: #ffffff;
    --muted: #a3a1ad;
    --danger: #e66767;
    --success: #1fbf6c;
    --radius: 16px;
  }
  body {
    background: var(--bg);
    background-image: radial-gradient(ellipse 900px 600px at 50% -10%, rgba(143,127,245,0.12), transparent);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .logo {
    text-align: center;
    margin-bottom: 2rem;
  }
  .logo-mark {
    width: 54px; height: 54px;
    background: linear-gradient(135deg, var(--accent), #6a5ce0);
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin-bottom: 0.85rem;
    box-shadow: 0 8px 24px rgba(143,127,245,0.4);
  }
  .logo h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .logo p { font-size: 12px; color: var(--muted); margin-top: 3px; }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  input {
    width: 100%;
    background: rgba(255,255,255,0.045);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    margin-bottom: 1rem;
    letter-spacing: 0.1em;
    font-family: inherit;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim); }
  .pin-wrap {
    display: flex;
    gap: 8px;
    margin-bottom: 1rem;
  }
  .pin-wrap input {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    padding: 14px 0;
    letter-spacing: 0;
    margin-bottom: 0;
    flex: 1;
  }
  .totp-input {
    text-align: center;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.4em;
  }
  button[type=submit] {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    margin-top: 0.5rem;
    box-shadow: 0 4px 16px rgba(143,127,245,0.35);
    transition: opacity 0.2s, transform 0.1s;
  }
  button[type=submit]:hover { opacity: 0.9; }
  button[type=submit]:active { transform: scale(0.98); }
  button[type=submit]:disabled { opacity: 0.5; cursor: not-allowed; }
  .err {
    background: rgba(255,79,79,0.1);
    border: 1px solid rgba(255,79,79,0.3);
    border-radius: 8px;
    color: var(--danger);
    font-size: 13px;
    padding: 10px 12px;
    margin-top: 1rem;
    display: none;
  }
  .step { display: none; }
  .step.active { display: block; }
  .step-label {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
  }
  .step-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border);
  }
  .step-dot.active { background: var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">⚡</div>
    <h1>TD Shopify Manager</h1>
    <p>thirddimension.pk</p>
  </div>

  <!-- Step 1: PIN -->
  <div class="step active" id="step1">
    <div class="step-label">
      <span class="step-dot active"></span>
      <span class="step-dot"></span>
      <span>Enter your PIN</span>
    </div>
    <label>PIN</label>
    <input type="password" class="totp-input" id="pin" maxlength="6" inputmode="numeric"
           pattern="[0-9]*" placeholder="••••••" autocomplete="off">
    <button type="submit" id="pin-btn" onclick="submitPin()">Continue →</button>
    <div class="err" id="pin-err"></div>
  </div>

  <!-- Step 2: 2FA -->
  <div class="step" id="step2">
    <div class="step-label">
      <span class="step-dot"></span>
      <span class="step-dot active"></span>
      <span>Google Authenticator code</span>
    </div>
    <label>6-digit code</label>
    <input type="text" class="totp-input" id="totp" maxlength="6" inputmode="numeric"
           placeholder="000000" autocomplete="one-time-code">
    <button type="submit" id="totp-btn" onclick="submitLogin()">Sign in →</button>
    <div class="err" id="totp-err"></div>
  </div>
</div>

<script>
  if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/static/sw.js').catch(()=>{}));}
  const pinField = document.getElementById('pin');
  pinField.addEventListener('input', () => {
    pinField.value = pinField.value.replace(/\D/g, '').slice(0, 6);
  });
  pinField.addEventListener('keydown', e => {
    if (e.key === 'Enter') submitPin();
  });
  pinField.focus();

  document.getElementById('totp').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitLogin();
  });

  function showErr(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideErr(id) {
    document.getElementById(id).style.display = 'none';
  }

  function submitPin() {
    const pin = pinField.value;
    if (pin.length < 4 || pin.length > 6) {
      showErr('pin-err', 'Please enter your 4–6 digit PIN');
      return;
    }
    hideErr('pin-err');
    // Move to step 2 — we verify PIN + TOTP together on backend
    window._pin = pin;
    document.getElementById('step1').classList.remove('active');
    document.getElementById('step2').classList.add('active');
    setTimeout(() => document.getElementById('totp').focus(), 100);
  }

  async function submitLogin() {
    const totp = document.getElementById('totp').value.replace(/\s/g, '');
    if (totp.length !== 6) {
      showErr('totp-err', 'Please enter the 6-digit code');
      return;
    }
    hideErr('totp-err');
    const btn = document.getElementById('totp-btn');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({pin: window._pin, totp})
      });
      if (res.ok) {
        window.location = '/dashboard';
      } else {
        const data = await res.json();
        showErr('totp-err', data.detail || 'Invalid credentials');
        btn.disabled = false;
        btn.textContent = 'Sign in →';
      }
    } catch(e) {
      showErr('totp-err', 'Network error, try again');
      btn.disabled = false;
      btn.textContent = 'Sign in →';
    }
  }
</script>
</body>
</html>
